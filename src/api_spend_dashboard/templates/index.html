<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API Spend Dashboard</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>API Spend Dashboard</h1>
          <p id="sync-status" role="status" aria-live="polite">Loading dashboard...</p>
        </div>
        <button id="sync-now" type="button">Sync now</button>
      </header>

      <main>
        <section id="summary-cards" class="summary-grid" aria-label="Monthly summary">
          <article class="metric-card skeleton"></article>
          <article class="metric-card skeleton"></article>
          <article class="metric-card skeleton"></article>
          <article class="metric-card skeleton"></article>
        </section>

        <section class="chart-grid" aria-label="Spend charts">
          <article class="panel">
            <div class="panel-heading">
              <h2>Actual Daily Spend</h2>
              <span>Real daily rows only</span>
            </div>
            <div class="chart-frame">
              <canvas id="trend-chart" aria-label="Actual daily spend by provider" role="img">
                Daily spend chart unavailable.
              </canvas>
              <p id="trend-chart-state" class="chart-state" aria-live="polite"></p>
            </div>
          </article>

          <article class="panel">
            <div class="panel-heading">
              <h2>Provider Share</h2>
              <span>Month spend mix</span>
            </div>
            <div class="chart-frame chart-frame--compact">
              <canvas id="share-chart" aria-label="Provider share of month spend" role="img">
                Provider share chart unavailable.
              </canvas>
              <p id="share-chart-state" class="chart-state" aria-live="polite"></p>
            </div>
          </article>
        </section>

        <section class="providers-section" aria-labelledby="providers-title">
          <div class="section-heading">
            <div>
              <h2 id="providers-title">Providers</h2>
              <p id="config-hint">Configuration status across tracked services.</p>
            </div>
          </div>
          <div id="provider-grid" class="provider-grid"></div>
        </section>
      </main>
    </div>
  </body>
</html>
